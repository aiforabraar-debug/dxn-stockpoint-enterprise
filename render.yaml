# =============================================================================
# DXN Stockpoint Enterprise — Render Deployment
# One-click deploy to Render Blueprint
# =============================================================================

databases:
  - name: dxn-stockpoint-db
    databaseName: dxn_stockpoint
    user: dxn_user
    plan: free

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: dxn-stockpoint-api
    env: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: dxn-stockpoint-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_PIN
        value: "2468"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://aiforabraar-debug.github.io,https://dxn-stockpoint-frontend.onrender.com,http://localhost:5173"
      - key: LOG_LEVEL
        value: info

  # ── Frontend (Static Site Backup) ──────────────────────────────────────────
  - type: web
    name: dxn-stockpoint-frontend
    env: static
    buildCommand: cd apps/frontend && npm install && npm run build
    staticPublishPath: apps/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://dxn-stockpoint-api.onrender.com
