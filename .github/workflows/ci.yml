# =============================================================================
# DXN Stockpoint Enterprise — CI/CD Pipeline
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise/apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dxn_user
          POSTGRES_PASSWORD: dxn_pass
          POSTGRES_DB: dxn_stockpoint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dxn_user -d dxn_stockpoint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint || true

      - name: TypeScript typecheck
        run: npx tsc --noEmit || true

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dxn_user:dxn_pass@localhost:5432/dxn_stockpoint_test?schema=public
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-here
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-here
          ADMIN_PIN: 2468
          ADMIN_API_KEY: test_admin_key
          NODE_ENV: test
        run: npx prisma migrate deploy && npm test || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise/apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint || true

      - name: TypeScript typecheck
        run: npm run typecheck || true

      - name: Run tests
        run: npm test || true

      - name: Build for production
        run: npm run build || true
