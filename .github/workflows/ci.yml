# =============================================================================
# DXN Stockpoint Enterprise — CI/CD Pipeline
# Runs on every push and pull request
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ── Backend: lint, typecheck, test ─────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise/apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dxn_user
          POSTGRES_PASSWORD: dxn_pass
          POSTGRES_DB: dxn_stockpoint_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dxn_user -d dxn_stockpoint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run tests
        env:
          DATABASE_URL: postgresql://dxn_user:dxn_pass@localhost:5432/dxn_stockpoint_test?schema=public
          JWT_ACCESS_SECRET: test-access-secret-min-32-chars-here
          JWT_REFRESH_SECRET: test-refresh-secret-min-32-chars-here
          ADMIN_PIN: 2468
          ADMIN_API_KEY: test_admin_key
          NODE_ENV: test
        run: npx prisma migrate deploy && npm test

  # ── Frontend: lint, typecheck, test, build ─────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise/apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build for production
        run: npm run build

  # ── Docker build & push ────────────────────────────────────────────────────
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: enterprise/docker/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/backend:cache,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: enterprise/docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/frontend:cache,mode=max
