# =============================================================================
# DXN Stockpoint Enterprise — Deployment Workflow
# Deploys to production via Docker Compose on a VPS
# =============================================================================

name: Deploy Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:latest
          docker pull ghcr.io/${{ github.repository }}/frontend:latest

      - name: Deploy with Docker Compose
        run: |
          docker-compose -f enterprise/docker-compose.yml up -d

      - name: Run database migrations
        run: |
          docker exec dxn-stockpoint-backend npx prisma migrate deploy

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:4000/health || exit 1
