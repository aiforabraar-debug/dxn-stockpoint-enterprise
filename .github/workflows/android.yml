name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/DXNStockpoint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release AAB
        run: ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-debug-apk
          path: android/DXNStockpoint/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-release-aab
          path: android/DXNStockpoint/app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: DXN Stockpoint v1.0.0
          files: |
            android/DXNStockpoint/app/build/outputs/apk/debug/*.apk
            android/DXNStockpoint/app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
