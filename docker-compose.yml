# =============================================================================
# DXN Stockpoint Enterprise — Docker Compose
# Production & self-hosting stack: PostgreSQL + API + Frontend (Nginx)
# =============================================================================

version: '3.8'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: dxn-stockpoint-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dxn_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dxn_pass}
      POSTGRES_DB: ${DB_NAME:-dxn_stockpoint}
    volumes:
      - dxn_db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dxn_user} -d ${DB_NAME:-dxn_stockpoint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dxn-network

  # ── Backend API ────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dxn-stockpoint-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${DB_USER:-dxn_user}:${DB_PASSWORD:-dxn_pass}@db:5432/${DB_NAME:-dxn_stockpoint}?schema=public"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-dxn-access-secret-change-in-production-min-32-chars}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-dxn-refresh-secret-change-in-production-min-32-chars}"
      ADMIN_PIN: "${ADMIN_PIN:-2468}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-dxn_admin_key_production_2026}"
      CORS_ORIGINS: "*"
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dxn-network

  # ── Frontend Web App (Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dxn-stockpoint-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - dxn-network

volumes:
  dxn_db_data:

networks:
  dxn-network:
    driver: bridge
